name: Node.js CI

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      # No `version:` input on purpose — pnpm/action-setup reads the pnpm version
      # from package.json's "packageManager" field. Passing `version:` as well
      # fails with "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Tests Typecheck
        run: pnpm test:typecheck
      - name: Test
        run: pnpm test
      - name: Examples typecheck
        run: pnpm examples:typecheck
      - name: Examples smoke
        run: pnpm examples:smoke
