name: Node.js CI

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      # No `version:` input on purpose — pnpm/action-setup reads the pnpm version
      # from package.json's "packageManager" field. Passing `version:` as well
      # fails with "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Tests Typecheck
        run: pnpm test:typecheck
      - name: Test
        run: pnpm test
      - name: Examples typecheck
        run: pnpm examples:typecheck
      - name: Examples smoke
        run: pnpm examples:smoke
