name: "Check PR title"

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            ^[A-Z]{3}-\d+
            deps
            deps-dev
            workflow
            release
            main
          requireScope: true
          ignoreLabels: |
            autorelease: pending
            dependencies
