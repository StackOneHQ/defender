on:
  push:
    branches:
      - main

name: release-please

permissions:
  id-token: write
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@c2a5a2bd6a758a0937f1ddb1e8950609867ed15c # v4
        id: release
        with:
          token: ${{ secrets.REPO_GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: steps.release.outputs.paths_released != '[]'
        with:
          lfs: true
      # No `version:` input on purpose — pnpm/action-setup reads the pnpm version
      # from package.json's "packageManager" field. Passing `version:` as well
      # fails with "Multiple versions of pnpm specified".
      - name: Setup pnpm
        if: steps.release.outputs.paths_released != '[]'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.release.outputs.paths_released != '[]'
        with:
          node-version: '22.20.0'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
      - name: Build
        if: steps.release.outputs.paths_released != '[]'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Publish
        if: steps.release.outputs.paths_released != '[]'
        run: |
          pnpm publish-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
