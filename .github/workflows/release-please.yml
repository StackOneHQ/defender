on:
  push:
    branches:
      - main

name: release-please

permissions:
  id-token: write
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.paths_released != '[]' }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.REPO_GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.paths_released != '[]'
        with:
          lfs: true
      # No `version:` input on purpose — pnpm/action-setup reads the pnpm version
      # from package.json's "packageManager" field. Passing `version:` as well
      # fails with "Multiple versions of pnpm specified".
      - name: Setup pnpm
        if: steps.release.outputs.paths_released != '[]'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.release.outputs.paths_released != '[]'
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
      - name: Build
        if: steps.release.outputs.paths_released != '[]'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Publish
        if: steps.release.outputs.paths_released != '[]'
        run: |
          pnpm publish-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # After a successful publish, open a parity issue in defender-py if Python is behind (ENG-1249).
  python-parity:
    needs: release-please
    if: needs.release-please.outputs.released == 'true' && needs.release-please.outputs.version != ''
    uses: ./.github/workflows/python-parity.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets:
      REPO_GH_PAT: ${{ secrets.REPO_GH_PAT }}
