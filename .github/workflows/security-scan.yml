name: Security scan

# Report-only: findings are written to the job summary and never fail the job.
# Tighten to blocking once the existing backlog is cleared.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  OSV_SCANNER_VERSION: "2.7.0"
  ZIZMOR_VERSION: "1.31.1"
  # Bump each version together with its hash. Hashes are pinned here, not read
  # from the release, so a replaced release asset fails verification.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
  ZIZMOR_SHA256: "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99"

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # -m includes merge commits, so conflict resolutions are scanned too. A push whose
          # previous commit is unavailable (new branch, force push) falls back to full history.
          args=(--log-opts="-m --full-history --all")
          scope="full history"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args=(--log-opts="-m ${PR_BASE_SHA}..${PR_HEAD_SHA}")
            scope="pull request commits"
          elif [ "$EVENT_NAME" = "push" ] && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            args=(--log-opts="-m ${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}")
            scope="pushed commits"
          fi
          # Scan a bare clone with a trusted config. A PR cannot allowlist its own findings:
          # its .gitleaks.toml and .gitleaksignore are not read and gitleaks:allow markers are ignored.
          git clone --quiet --mirror "$GITHUB_WORKSPACE" "$RUNNER_TEMP/scan.git"
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          gitleaks git --redact --no-banner --exit-code 0 --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/scan.git" --config "$RUNNER_TEMP/gitleaks.toml" \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" \
            "${args[@]}" "$RUNNER_TEMP/scan.git"
          count=0
          if [ -f "$RUNNER_TEMP/gitleaks.sarif" ]; then
            count=$(jq '[.runs[].results[]?] | length' "$RUNNER_TEMP/gitleaks.sarif")
          fi
          {
            echo "## gitleaks"
            echo
            echo "Scope: $scope. Potential secrets found: **$count** (values are redacted and not printed)."
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Rule | Count |"
              echo "| --- | --- |"
              jq -r '[.runs[].results[]?.ruleId] | group_by(.) | .[] | "| \(.[0]) | \(length) |"' "$RUNNER_TEMP/gitleaks.sarif"
              echo
              echo "Run \`gitleaks git --redact\` locally to see file locations."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  osv-scanner:
    name: Dependency scan (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/osv-scanner"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          curl -fsSL --retry 3 -o osv-scanner_linux_amd64 "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner_linux_amd64" | sha256sum -c -
          install -m 0755 osv-scanner_linux_amd64 osv-scanner
          rm osv-scanner_linux_amd64
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan lockfiles
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/osv.md"
          rc=0
          osv-scanner scan source -r --format markdown . > "$report" || rc=$?
          # 0 = clean, 1 = vulnerabilities found (report-only), 128 = no packages found.
          case "$rc" in
            0|1|128) ;;
            *)
              echo "osv-scanner failed with exit code $rc" >> "$GITHUB_STEP_SUMMARY"
              exit "$rc"
              ;;
          esac
          {
            echo "## osv-scanner"
            echo
            if [ -s "$report" ]; then
              head -c 900000 "$report"
            else
              echo "No report produced (no supported lockfiles, or the scan did not complete)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  zizmor:
    name: Workflow scan (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/zizmor"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/$archive"
          echo "${ZIZMOR_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" zizmor
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/zizmor.json"
          zizmor --format json --no-exit-codes --strict-collection .github > "$report"
          {
            echo "## zizmor"
            echo
            if jq -e 'type == "array"' "$report" > /dev/null 2>&1; then
              echo "Findings: **$(jq '[.[] | select(.ignored | not)] | length' "$report")** (rule, severity and location only; source snippets are not printed)."
              echo
              echo "| Audit | Severity | Location |"
              echo "| --- | --- | --- |"
              jq -r 'limit(300; .[] | select(.ignored | not) | .ident as $i | .determinations.severity as $s | (.locations[] | select(.symbolic.kind == "Primary") | "\(.symbolic.key.Local.verbatim_path // "?"):\(.concrete.location.start_point.row + 1)") as $l | "| \($i) | \($s) | \($l) |")' "$report"
            else
              echo "No report produced; zizmor did not complete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
