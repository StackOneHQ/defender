name: Security scan

# Report-only: findings are written to the job summary and never fail the job.
# Tighten to blocking once the existing backlog is cleared.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  OSV_SCANNER_VERSION: "2.7.0"
  ZIZMOR_VERSION: "1.31.1"
  ZIZMOR_SHA256: "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99"

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL --retry 3 -o "$archive" "$base/$archive"
          curl -fsSL --retry 3 -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -F "  $archive" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=()
          scope="full history"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args+=(--log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}")
            scope="pull request commits"
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            args+=(--log-opts="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}")
            scope="pushed commits"
          fi
          gitleaks git --redact --no-banner --exit-code 0 \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" \
            "${args[@]}"
          count=0
          if [ -f "$RUNNER_TEMP/gitleaks.sarif" ]; then
            count=$(jq '[.runs[].results[]?] | length' "$RUNNER_TEMP/gitleaks.sarif")
          fi
          {
            echo "## gitleaks"
            echo
            echo "Scope: $scope. Potential secrets found: **$count** (values are redacted and not printed)."
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Rule | Count |"
              echo "| --- | --- |"
              jq -r '[.runs[].results[]?.ruleId] | group_by(.) | .[] | "| \(.[0]) | \(length) |"' "$RUNNER_TEMP/gitleaks.sarif"
              echo
              echo "Run \`gitleaks git --redact\` locally to see file locations."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  osv-scanner:
    name: Dependency scan (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/osv-scanner"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          curl -fsSL --retry 3 -o osv-scanner_linux_amd64 "$base/osv-scanner_linux_amd64"
          curl -fsSL --retry 3 -o osv-scanner_SHA256SUMS "$base/osv-scanner_SHA256SUMS"
          grep -F "  osv-scanner_linux_amd64" osv-scanner_SHA256SUMS | sha256sum -c -
          install -m 0755 osv-scanner_linux_amd64 osv-scanner
          rm osv-scanner_linux_amd64
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan lockfiles
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/osv.md"
          osv-scanner scan source -r --format markdown . > "$report" || true
          {
            echo "## osv-scanner"
            echo
            if [ -s "$report" ]; then
              head -c 900000 "$report"
            else
              echo "No report produced (no supported lockfiles, or the scan did not complete)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  zizmor:
    name: Workflow scan (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/zizmor"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/$archive"
          echo "${ZIZMOR_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" zizmor
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/zizmor.json"
          zizmor --format json --no-exit-codes .github/workflows > "$report" 2> "$RUNNER_TEMP/zizmor.err" || true
          {
            echo "## zizmor"
            echo
            if jq -e 'type == "array"' "$report" > /dev/null 2>&1; then
              echo "Findings: **$(jq '[.[] | select(.ignored | not)] | length' "$report")** (rule, severity and location only; source snippets are not printed)."
              echo
              echo "| Audit | Severity | Location |"
              echo "| --- | --- | --- |"
              jq -r 'limit(300; .[] | select(.ignored | not) | .ident as $i | .determinations.severity as $s | (.locations[] | select(.symbolic.kind == "Primary") | "\(.symbolic.key.Local.verbatim_path // "?"):\(.concrete.location.start_point.row + 1)") as $l | "| \($i) | \($s) | \($l) |")' "$report"
            else
              echo "No report produced; zizmor did not complete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
